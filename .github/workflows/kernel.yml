name: kernel-build

on:
  push:
    branches: [ unisoc-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 环境信息
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          aarch64-linux-gnu-gcc --version | head -1 || true

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: defconfig
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sprd_ums9157_defconfig 2>&1 | tee defconfig.log
          test -f .config
          echo "--- 生效的关键配置:"
          grep -E "^(CONFIG_LTO|CONFIG_CFI|CONFIG_CC_IS|CONFIG_MODULES)=" .config || true

      - name: 编译 Image
        run: |
          set -euo pipefail
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tee build.log
          ls -l arch/arm64/boot/Image

      - name: 编译 modules
        run: |
          set -euo pipefail
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee modules.log

      - name: 错误摘要
        if: failure()
        run: |
          for f in build.log modules.log defconfig.log; do
            [ -f "$f" ] || continue
            echo "=== $f: error 行 ==="
            grep -nE "error:|Error [0-9]|fatal error|No rule to make" "$f" | head -40 || true
            echo "=== $f: 最后 20 行 ==="
            tail -20 "$f"
          done

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            modules.log
            defconfig.log
            .config
            arch/arm64/boot/Image
          retention-days: 14
          if-no-files-found: warn
