name: kernel-build

on:
  # 只允许手动触发：Actions 页面 → kernel-build → Run workflow。
  # 之前是 push 即编译，一次推送就跑 2 小时，full LTO 更是烧额度。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 环境信息
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          aarch64-linux-gnu-gcc --version | head -1 || true

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 缓存 Android clang 12.0.5 (r416183b)
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang-r416183b
          key: android-clang-r416183b-v1

      - name: 下载 Android clang 12.0.5 (r416183b)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # 设备内核就是这个工具链编的：CONFIG_CC_VERSION_TEXT="Android (7284624, based on
          # r416183b) clang version 12.0.5 (... c935d99d7cf2016289302412d708641d52d2f7ee)"
          # Ubuntu jammy 只有 clang-12 = 12.0.1，差 4 个补丁版本，CFI typeid / SCS 代码生成
          # 未必一致，所以直接用 AOSP 官方预编译包。GitHub runner 能直连 googlesource。
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          mkdir -p "$HOME/clang-r416183b"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/clang.tgz "$URL"
          ls -l /tmp/clang.tgz
          tar -xzf /tmp/clang.tgz -C "$HOME/clang-r416183b"

      - name: 启用 clang 12.0.5
        run: |
          set -euo pipefail
          echo "$HOME/clang-r416183b/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/clang-r416183b/lib64:$HOME/clang-r416183b/lib" >> "$GITHUB_ENV"
          export PATH="$HOME/clang-r416183b/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/clang-r416183b/lib64:$HOME/clang-r416183b/lib"
          echo "--- clang:";    clang --version | head -1
          echo "--- lld:";      ld.lld --version | head -1
          echo "--- llvm-ar:";  llvm-ar --version | head -1
          clang --version | head -1 | grep -q 'clang version 12\.0\.5' || { echo 'ERROR: 不是 Android clang 12.0.5（缓存可能损坏，删掉 cache 重试）'; exit 1; }

      - name: 加 swap（LTO+CFI 编译很吃内存）
        continue-on-error: true
        run: |
          # 上一次 run 就是跑到 73 分钟时 "The hosted runner lost communication
          # with the server"，即被 OOM killer 干掉了。LTO 链接阶段单进程要几 GB。
          # 不能用 fallocate：上次它在 overlay 上留下一个被持有的文件，
          # 后面的 dd 就报 “Text file busy”。直接 dd 到全新文件。
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none || exit 0
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile || true
          free -g
          sudo swapon --show || true

      - name: defconfig
        run: |
          set -euo pipefail
          # 屏蔽 scm_version 追加的 '+'：CI checkout 后 git status 会报脏，
          # scripts/setlocalversion 就会把 vermagic 变成 '...-ab50+'，与设备不符。
          # 该脚本开头检测到 .scmversion 就只输出它的内容，空文件 => 无 '+'。
          : > .scmversion
          # 必须用 clang：设备内核是 CC_IS_CLANG + LTO_CLANG + CFI_CLANG + SHADOW_CALL_STACK，
          # 用 gcc 编时这四个符号会被 olddefconfig 静默丢弃（defconfig 里写了也没用），
          # 结果内核没有 __cfi_slowpath、也不维护 x18，原厂 .ko 的 SCS 序言会写到垃圾地址，
          # 模块加载/调用即崩 —— 这是「卡第一屏后重启」的真正原因（不是 vermagic）。
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sprd_ums9157_defconfig 2>&1 | tee defconfig.log
          test -f .config
          # 硬校验：这几项是本内核与设备一致、且能加载设备原厂模块的前提
          for c in CONFIG_CC_IS_CLANG CONFIG_LTO_CLANG CONFIG_CFI_CLANG CONFIG_SHADOW_CALL_STACK CONFIG_MODVERSIONS; do
            grep -q "^$c=y" .config || { echo "ERROR: $c 没有生效（工具链用错了？）"; exit 1; }
          done
          # full LTO（不是 ThinLTO），与设备一致
          grep -q "^CONFIG_THINLTO=y" .config || { echo "ERROR: THINLTO 未开启（设备是 full LTO，但我们用 ThinLTO，16G runner 编不动 full）"; exit 1; }
          # 工具链必须是 Android clang 12.0.5，否则说明下载/ PATH 没生效
          grep -q "^CONFIG_CLANG_VERSION=120005" .config || { echo "ERROR: 不是 clang 12.0.5：$(grep CONFIG_CLANG_VERSION= .config)"; exit 1; }
          grep -q '^CONFIG_CC_VERSION_TEXT="Android' .config || { echo "ERROR: 不是 Android clang：$(grep CONFIG_CC_VERSION_TEXT= .config)"; exit 1; }
          grep -E "^(CONFIG_CC_IS|CONFIG_LTO|CONFIG_CFI|CONFIG_SHADOW_CALL|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION)" .config

      - name: 编译 Image（-k 一次收集全部错误）
        run: |
          timeout 12000 make -k -j2 LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tee build.log || true
          test -f arch/arm64/boot/Image

      - name: 编译 modules（-k 一次收集全部错误）
        run: |
          timeout 12000 make -k -j2 LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee modules.log || true
          test -f modules.order

      - name: 错误清单（去重）
        if: always()
        run: |
          for f in build.log modules.log defconfig.log; do
            [ -f "$f" ] || continue
            echo "########## $f ##########"
            grep -hoE '[^ :]+\.(c|h|S):[0-9]+:[0-9]+: (error|fatal error):.*' "$f" \
              | sort -u | head -200 || true
            echo "---------- 计数:"
            grep -cE ' error: ' "$f" || true
          done
          # 通过 annotation 暴露错误行，便于无 token 的 API 读取
          grep -hoE '[^ :]+\.(c|h|S):[0-9]+:[0-9]+: (error|fatal error):.*' build.log 2>/dev/null \
            | sort -u | head -25 | while IFS= read -r line; do
                echo "::error::$line"
              done
          grep -E 'undefined reference to' build.log 2>/dev/null \
            | sed 's/^ *//' | sort -u | head -25 | while IFS= read -r line; do
                echo "::error::$line"
              done

      - name: 校验 vermagic 与设备一致
        if: always()
        run: |
          # 设备: 5.4.210-android12-9-g96901d45d5a5-ab50 SMP preempt mod_unload aarch64
          KO=$(find . -name 'dwc3-sprd-core.ko' | head -1)
          if [ -n "$KO" ]; then
            VM=$(strings -a "$KO" | grep -m1 '^vermagic=')
            echo "got: $VM"
            case "$VM" in
              "vermagic=5.4.210-android12-9-g96901d45d5a5-ab50 SMP preempt mod_unload aarch64")
                echo "OK: vermagic 与设备逐字符一致" ;;
              *)
                echo "::error::vermagic 与设备不一致: $VM"
                exit 1 ;;
            esac
          else
            echo "没有 dwc3-sprd-core.ko，跳过"
          fi

      - name: 打包 boot.img（可直接刷）
        if: always()
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            python3 scripts/pack_boot.py --kernel arch/arm64/boot/Image --out boot.img --pad-to 67108864
            python3 scripts/pack_boot.py --verify boot.img
            ls -lh boot.img
          else
            echo "没有 Image，跳过打包"
          fi

      - name: 收集模块（.ko）
        if: always()
        run: |
          find . -path ./.git -prune -o -name '*.ko' -print0 | tar --null -czf modules.tgz -T - || true
          ls -lh modules.tgz 2>/dev/null || true
          echo "ko count: $(tar -tzf modules.tgz 2>/dev/null | grep -c '\.ko$' || echo 0)"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            modules.log
            defconfig.log
            .config
            arch/arm64/boot/Image
            boot.img
            modules.tgz
            Module.symvers
            System.map
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
