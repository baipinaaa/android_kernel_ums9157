name: kernel-build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 环境信息
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          aarch64-linux-gnu-gcc --version | head -1 || true

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: defconfig
        run: |
          set -euo pipefail
          # 屏蔽 scm_version 追加的 '+'：CI checkout 后 git status 会报脏，
          # scripts/setlocalversion 就会把 vermagic 变成 '...-ab50+'，与设备不符。
          # 该脚本开头检测到 .scmversion 就只输出它的内容，空文件 => 无 '+'。
          : > .scmversion
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sprd_ums9157_defconfig 2>&1 | tee defconfig.log
          test -f .config
          grep -E "^(CONFIG_LTO|CONFIG_CFI|CONFIG_CC_IS|CONFIG_MODULES)=" .config || true

      - name: 编译 Image（-k 一次收集全部错误）
        run: |
          make -k -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tee build.log || true
          test -f arch/arm64/boot/Image

      - name: 编译 modules（-k 一次收集全部错误）
        run: |
          make -k -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee modules.log || true
          test -f modules.order

      - name: 错误清单（去重）
        if: always()
        run: |
          for f in build.log modules.log defconfig.log; do
            [ -f "$f" ] || continue
            echo "########## $f ##########"
            grep -hoE '[^ :]+\.(c|h|S):[0-9]+:[0-9]+: (error|fatal error):.*' "$f" \
              | sort -u | head -200 || true
            echo "---------- 计数:"
            grep -cE ' error: ' "$f" || true
          done
          # 通过 annotation 暴露错误行，便于无 token 的 API 读取
          grep -hoE '[^ :]+\.(c|h|S):[0-9]+:[0-9]+: (error|fatal error):.*' build.log 2>/dev/null \
            | sort -u | head -25 | while IFS= read -r line; do
                echo "::error::$line"
              done
          grep -E 'undefined reference to' build.log 2>/dev/null \
            | sed 's/^ *//' | sort -u | head -25 | while IFS= read -r line; do
                echo "::error::$line"
              done

      - name: 校验 vermagic 与设备一致
        if: always()
        run: |
          # 设备: 5.4.210-android12-9-g96901d45d5a5-ab50 SMP preempt mod_unload aarch64
          KO=$(find . -name 'dwc3-sprd-core.ko' | head -1)
          if [ -n "$KO" ]; then
            VM=$(python3 - "$KO" <<'PY'
import sys
d=open(sys.argv[1],'rb').read()
i=d.find(b'vermagic=')
print(d[i:i+110].split(b'\x00')[0].decode() if i>=0 else 'NOT FOUND')
PY
)
            echo "$VM"
            case "$VM" in
              *"5.4.210-android12-9-g96901d45d5a5-ab50 SMP preempt mod_unload aarch64") echo "OK: vermagic 与设备一致" ;;
              *) echo "::error::vermagic 与设备不一致: $VM"; exit 1 ;;
            esac
          fi

      - name: 打包 boot.img（可直接刷）
        if: always()
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            python3 scripts/pack_boot.py --kernel arch/arm64/boot/Image --out boot.img --pad-to 67108864
            python3 scripts/pack_boot.py --verify boot.img
            ls -lh boot.img
          else
            echo "没有 Image，跳过打包"
          fi

      - name: 收集模块（.ko）
        if: always()
        run: |
          find . -path ./.git -prune -o -name '*.ko' -print0 | tar --null -czf modules.tgz -T - || true
          ls -lh modules.tgz 2>/dev/null || true
          echo "ko count: $(tar -tzf modules.tgz 2>/dev/null | grep -c '\.ko$' || echo 0)"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            modules.log
            defconfig.log
            .config
            arch/arm64/boot/Image
            boot.img
            modules.tgz
            Module.symvers
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
